<!DOCTYPE html>
<html>
  <head>
    <title>TaliCorp™ Network Status</title>
    <link href="/styles.css" type="text/css" rel="stylesheet"/>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://unpkg.com/htmx.org@1.9.10" integrity="sha384-D1Kt99CQMDuVetoL1lrYwg5t+9QdHe7NLX/SoJYkXDFfX37iInKRy5xLSi8nO7UC" crossorigin="anonymous"></script>
  </head>
  <body class="bg-rose-50 font-sans">
    <div class="w-full px-10 py-5 bg-rose-950 flex items-center">
      <h1 class="grow text-3xl text-rose-50">TaliCorp™ Network Status</h1>

      <img class="max-h-12 flex-none hover:rotate-90 duration-200"
        alt="logo"
        src="https://home.tali.network/static/art/favicons/tc-logo-red-192x192.png"/>
    </div>

    <main class="px-10">
      <div class="flex items-end w-full py-5 gap-5">
        <div hx-get="/stats/uptime" hx-trigger="load, every 15s"></div>
        <div class="grow text-right" hx-get="/slogan" hx-trigger="load, every 5m"></div>
      </div>

      <div class="grid w-full gap-5 grid-cols-2 md:grid-cols-4">
        {{ range .Links }}
          <a href="{{.Url}}">
            <div class="h-12 w-full border-b-2 bg-violet-200 hover:bg-violet-300 border-rose-950 flex justify-center items-center text-center text-xl duration-100">
              <div>{{.Name}}</div>
            </div>
          </a>
        {{ end }}
      </div>

      <div class="flex flex-wrap gap-5 w-full py-5">
        {{ range .Services }}
          <div hx-get="/stats/systemd/{{.Name}}" hx-trigger="load, every 15s"></div>
        {{ end }}
      </div>

      <pre class="py-5 px-10" hx-get="/stats/zpool-status" hx-trigger="load, every 15s"></pre>
    </main>
  </body>
</html>
